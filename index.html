    const playDing = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {
        console.error("Audio error", e);
      }
    };

    // --- COMPONENTS ---
    const BackgroundWrapper = ({ children }) => (

    const WheelSpinner = ({ items, onLock, lang = 'TH' }) => {
      const scrollRef = useRef(0);
      const velocityRef = useRef(0);
      const isDraggingRef = useRef(false);
      const lastYRef = useRef(0);
      const animFrameRef = useRef(null);
      const lastDingIdxRef = useRef(-1);
      
      const itemHeight = 70;
      const extendedItems = [...items, ...items, ...items, ...items, ...items];
      
      const [offset, setOffset] = useState(extendedItems.length * itemHeight / 2);
      const [locked, setLocked] = useState(false);
      const [selectedIdx, setSelectedIdx] = useState(null);
      const [spinCount, setSpinCount] = useState(0);

      useEffect(() => {
         scrollRef.current = Math.floor(extendedItems.length / 2) * itemHeight;
         setOffset(scrollRef.current);
      }, []);

      const handleTouchStart = (e) => {
        if (locked || spinCount >= 2) return;
        cancelAnimationFrame(animFrameRef.current);
        isDraggingRef.current = true;
        lastYRef.current = e.touches ? e.touches[0].clientY : e.clientY;
        velocityRef.current = 0;
      };

      const handleTouchMove = (e) => {
        if (!isDraggingRef.current || locked || spinCount >= 2) return;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const delta = lastYRef.current - currentY;
        lastYRef.current = currentY;
        velocityRef.current = delta;
        scrollRef.current += delta;
        setOffset(scrollRef.current);
      };

      const handleTouchEnd = () => {
        if (!isDraggingRef.current || locked || spinCount >= 2) return;
        isDraggingRef.current = false;
        
        if (Math.abs(velocityRef.current) > 2) {
           setSpinCount(prev => prev + 1);
        }
        momentumLoop();
      };

      const momentumLoop = () => {
         if (isDraggingRef.current) return;
         
         const snapIndex = Math.round(scrollRef.current / itemHeight);
         const targetScroll = snapIndex * itemHeight;
         const diff = targetScroll - scrollRef.current;
         
         let isAnimating = false;
         
         if (Math.abs(velocityRef.current) > 0.5) {
            scrollRef.current += velocityRef.current;
            velocityRef.current *= 0.95; 
            isAnimating = true;
         } else if (Math.abs(diff) > 0.5) {
            scrollRef.current += diff * 0.15; 
            isAnimating = true;
         }
         
         if (isAnimating) {
            setOffset(scrollRef.current);
            const currentIdx = Math.round(scrollRef.current / itemHeight);
            if (currentIdx !== lastDingIdxRef.current) {
               playDing();
               lastDingIdxRef.current = currentIdx;
            }
            animFrameRef.current = requestAnimationFrame(momentumLoop);
         } else {
            scrollRef.current = targetScroll;
            setOffset(scrollRef.current);
            setSelectedIdx(snapIndex % items.length);
         }
      };

      const statusText = spinCount >= 2 
         ? (lang === 'TH' ? 'สุ่มครบโควต้าแล้ว กด START เพื่อไปต่อ' : 'Quota reached. Press START to continue.')
         : (lang === 'TH' ? `ปัดเพื่อสุ่ม (เหลือสิทธิ์สุ่มอีก ${2 - spinCount} ครั้ง)` : `Swipe to spin (${2 - spinCount} spins left)`);

      return (
        <div className="w-full flex flex-col items-center">
           <div 
             className={`relative w-full h-[350px] overflow-hidden bg-black/50 rounded-3xl border-2 touch-none ${spinCount >= 2 ? 'border-red-500/50' : 'border-gray-700'}`}
             onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}
             onMouseDown={handleTouchStart} onMouseMove={handleTouchMove} onMouseUp={handleTouchEnd} onMouseLeave={handleTouchEnd}

             <div className="absolute top-0 w-full h-[30%] bg-gradient-to-b from-black to-transparent z-10 pointer-events-none"></div>

             </p>
           </div>

    };

    const CardGrid = ({ players, currentUser, state, isDarkMode, lang = 'TH' }) => {
       const count = players.length;
       let gridClass = "grid gap-2 sm:gap-4 w-full h-full max-w-4xl mx-auto p-2 " + (count <= 2 ? "grid-cols-1 grid-rows-2" : "grid-cols-2 grid-rows-2");
       
       const cardBg = isDarkMode ? 'bg-black text-white border-gray-800' : 'bg-white text-black border-gray-300';
       const wordColor = isDarkMode ? 'text-white' : 'text-black';
       const shadowColor = isDarkMode ? 'rgba(0,0,0,1)' : 'rgba(0,0,0,0.2)';

       // Network sync buffer: Waits 800ms before flipping so all devices execute simultaneously
       const [syncedFlip, setSyncedFlip] = useState(false);
       useEffect(() => {
          if (state === 'revealed') {
             const timer = setTimeout(() => setSyncedFlip(true), 800);
             return () => clearTimeout(timer);
          } else {
             setSyncedFlip(false);
          }
       }, [state]);

       return (
          <div className={gridClass}>
             {players.map((p) => {
                const isMe = p.uid === currentUser.uid;
                const itemClass = `flex justify-center items-center h-full w-full min-h-0 ${count === 3 && p.order === 3 ? 'col-span-2' : ''}`;
                const isFlipped = syncedFlip;
                
                return (
                   <div key={p.uid} className={`${itemClass} [perspective:1500px]`}>
                      <div className={`relative w-full h-full max-h-[100%] max-w-[220px] sm:max-w-[260px] aspect-[2.5/3.5] mx-auto transition-transform duration-700 [transform-style:preserve-3d] ${isFlipped ? '[transform:rotateY(180deg)]' : '[transform:rotateY(0deg)]'}`}>
                         
                         {/* FRONT OF CARD */}
                         <div 
                              className={`absolute inset-0 flex flex-col items-center justify-center p-4 border-4 rounded-3xl ${isMe ? 'border-yellow-400' : ''} ${cardBg}`}
                              style={{ 
                                  boxShadow: `-4px 6px 0px ${shadowColor}`, 
                                  WebkitBackfaceVisibility: 'hidden', 
                                  backfaceVisibility: 'hidden',
                                  transform: 'translateZ(1px)', // Forces iOS Safari to strictly layer the front face
                                  opacity: isFlipped ? 0 : 1,
                                  transition: 'opacity 0.3s ease-in-out 0.2s' // Smooth crossfade mid-flip to prevent blinking
                              }}
                         >
                            <div className="absolute inset-2 border-2 border-dashed border-gray-400/50 rounded-2xl pointer-events-none"></div>
                            <h3 className="text-3xl font-black z-10 break-words text-center">{p.name}</h3>
                            {isMe && <span className="absolute bottom-4 text-xs font-bold text-yellow-700 bg-yellow-100 px-3 py-1 rounded-full z-10 shadow">{lang === 'TH' ? 'คุณ' : 'You'}</span>}
                         </div>

                         {/* BACK OF CARD */}
                         <div 
                              className={`absolute inset-0 flex flex-col items-center justify-center p-4 border-4 rounded-3xl ${isMe ? 'border-yellow-400' : ''} ${cardBg}`}
                              style={{ 
                                  boxShadow: `4px 6px 0px ${shadowColor}`, 
                                  transform: 'rotateY(180deg) translateZ(1px)', // Forces iOS Safari to strictly layer the back face
                                  WebkitBackfaceVisibility: 'hidden', 
                                  backfaceVisibility: 'hidden',
                                  opacity: isFlipped ? 1 : 0,
                                  transition: 'opacity 0.3s ease-in-out 0.2s' // Smooth crossfade mid-flip to prevent blinking
                              }}
                         >
                            <div className="absolute inset-2 border-2 border-dashed border-gray-400/50 rounded-2xl pointer-events-none"></div>
                            <span className="absolute top-4 text-sm font-bold text-gray-500 uppercase z-10">{p.name}</span>
                            <div className="flex-1 flex items-center justify-center w-full z-10">
                                {isMe ? 
                                  <span className="text-gray-400 italic text-center font-bold text-lg">{lang === 'TH' ? '(ซ่อน)' : '(Hidden)'}</span> 
                                  : 
                                  <span className={`text-4xl md:text-5xl font-black text-center break-words leading-tight ${wordColor}`}>{p.word}</span>
                                }
                            </div>
                            {isMe && <span className="absolute bottom-4 text-xs font-bold text-yellow-700 bg-yellow-100 px-3 py-1 rounded-full z-10 shadow">{lang === 'TH' ? 'คุณ' : 'You'}</span>}
                         </div>
                      </div>
                   </div>
                );
             })}

       );
    };

    // --- MAIN APP ---
    function App() {
      const [user, setUser] = useState(null);
      const [nickname, setNickname] = useState(() => localStorage.getItem('nickname') || '');
      const [roomCodeInput, setRoomCodeInput] = useState('');
      const [room, setRoom] = useState(null);
      const [roomId, setRoomId] = useState(null);
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [lang, setLang] = useState('TH');
      
      const pressTimerRef = useRef(null);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) setUser(currentUser);
          else signInAnonymously(auth).catch(e => console.error("Auth error", e));
        });
        if (window.location.hash) setRoomCodeInput(window.location.hash.substring(1).toUpperCase());
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !roomId) return;
        const docRef = doc(db, 'rooms', roomId);
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
             const data = docSnap.data();
             setRoom(data);
             if (data.lang) setLang(data.lang);
          }
        });
        return () => unsubscribe();
      }, [user, roomId]);

      useEffect(() => {
        if (roomId) window.location.hash = roomId;
        else window.location.hash = '';
      }, [roomId]);

      useEffect(() => {
        if (room?.state === 'menu') {
           setRoomId(null);
           setRoom(null);
           window.location.hash = '';
           window.location.reload(); // Force full reload to completely fix the stuck DB state bug
           return;
        }
        if (!room || !user || !roomId || room.state !== 'revealed') return;
        const activeCount = room.players.length;
        if (room.replayVotes?.length >= activeCount) resetGame(true);
        else if (room.restartVotes?.length >= activeCount) resetGame(false);
      }, [room?.replayVotes, room?.restartVotes, room?.state, room?.players.length]);

    const createRoom = async () => {
        if (!nickname || !roomCodeInput) return;
        const newRoomId = roomCodeInput;
        await setDoc(doc(db, 'rooms', newRoomId), {
          hostId: user.uid,
          lang: lang,
          state: 'settings',
          settings: { maxPlayers: 4, mode: 'อิสระ' },
          players: [{ uid: user.uid, name: nickname, word: '', order: 1 }],
          category: '', replayVotes: [], restartVotes: []
        });
        setRoomId(newRoomId);
      };

      const joinRoom = async () => {
        if (!nickname || !roomCodeInput) return;
        setRoomId(roomCodeInput);
        const docRef = doc(db, 'rooms', roomCodeInput);
        const unsub = onSnapshot(docRef, async (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (!data.players.find(p => p.uid === user.uid) && data.players.length < data.settings.maxPlayers) {
               await updateDoc(docRef, { players: [...data.players, { uid: user.uid, name: nickname, word: '', order: data.players.length + 1 }] });
            }
          }
          unsub();
        });
      };

      const updateSetting = async (key, val) => {
        if (room.hostId === user.uid) await updateDoc(doc(db, 'rooms', roomId), { [`settings.${key}`]: val });
      };

      const startGameSequence = async () => {
        if (room.settings.mode === 'หมวดหมู่') await updateDoc(doc(db, 'rooms', roomId), { state: 'spinning' });
        else assignWordsAndStart(null);
      };

      const assignWordsAndStart = async (selectedCategory) => {
        let pool = [];
        let catText = selectedCategory || (lang === 'TH' ? 'อิสระ' : 'Random');
        const activeCategories = lang === 'TH' ? CATEGORIES : CATEGORIES_EN;

        if (selectedCategory) pool = activeCategories[selectedCategory];
        else Object.values(activeCategories).forEach(words => pool.push(...words));

        const shuffledPool = [...pool].sort(() => 0.5 - Math.random());
        const newPlayers = room.players.map((p, idx) => ({ ...p, word: shuffledPool[idx % shuffledPool.length] }));

        await updateDoc(doc(db, 'rooms', roomId), { players: newPlayers, category: catText, state: 'pregame', replayVotes: [], restartVotes: [] });
        setTimeout(async () => { await updateDoc(doc(db, 'rooms', roomId), { state: 'playing' }); }, 2000);
      };

      const handleVote = async (type) => {
        const otherType = type === 'replayVotes' ? 'restartVotes' : 'replayVotes';
        const newTargetVotes = [...new Set([...(room[type] || []), user.uid])];
        const newOtherVotes = (room[otherType] || []).filter(uid => uid !== user.uid);
        
        await updateDoc(doc(db, 'rooms', roomId), { 
          [type]: newTargetVotes,
          [otherType]: newOtherVotes
        });
      };

      const resetGame = async (keepSettings) => {
         if (room.hostId !== user.uid) return;
         if (keepSettings) startGameSequence();
         else await updateDoc(doc(db, 'rooms', roomId), { state: 'menu' });
      };

      if (!roomId || !room) {
        const inputBg = isDarkMode ? 'bg-gray-400 text-black placeholder-gray-600' : 'bg-white text-black placeholder-gray-400';
        return (
          <BackgroundWrapper>
            <div className="flex flex-col items-center justify-center min-h-screen p-4 w-full max-w-md mx-auto z-10 relative">
              <h1 className="text-6xl font-black text-white mb-1 tracking-wider">
                {lang === 'TH' ? 'คำต้องห้าม' : 'Taboo'}
              </h1>
              <p className="text-gray-600 text-[10px] font-bold mb-6 tracking-widest uppercase">dsi v0.8.2 - safari fix</p>
              
              <div className="w-full bg-black/60 p-6 rounded-3xl backdrop-blur-md shadow-2xl">
                <input 
                  type="text" 
                  value={nickname} 
                  onChange={e => { setNickname(e.target.value); localStorage.setItem('nickname', e.target.value); }}
                  className={`w-full p-4 rounded-2xl font-bold text-xl text-center mb-6 transition-colors ${inputBg}`}
                  placeholder={lang === 'TH' ? 'ใส่ชื่อเล่น' : 'Enter Nickname'}
                />
                <div className="mb-8">
                  <p className="text-gray-300 text-center font-bold mb-3">{lang === 'TH' ? 'เลือกห้อง' : 'Select Room'}</p>
                  <div className="flex space-x-3 justify-center">
                    {['1', '2', '3', '4'].map(num => (
                      <button key={num} onClick={() => setRoomCodeInput(num)} className={`w-14 h-14 rounded-full font-black text-2xl transition-all ${roomCodeInput === num ? 'bg-yellow-400 text-black scale-110 shadow-lg' : 'bg-gray-700 text-white'}`}>{num}</button>
                    ))}
                  </div>
                </div>
                <div className="flex space-x-3">
                   <button onClick={createRoom} disabled={!nickname || !roomCodeInput} className="flex-1 bg-white text-black font-black py-4 rounded-2xl text-xl disabled:opacity-50 active:scale-95 transition shadow-lg">{lang === 'TH' ? 'สร้างห้อง' : 'Create'}</button>
                   <button onClick={joinRoom} disabled={!nickname || !roomCodeInput} className="flex-1 bg-blue-600 text-white font-black py-4 rounded-2xl text-xl disabled:opacity-50 active:scale-95 transition shadow-lg">{lang === 'TH' ? 'เข้าร่วม' : 'Join'}</button>
                </div>
              </div>
              <div className="w-full flex justify-end mt-4 space-x-3">
                <button onClick={() => setLang(lang === 'TH' ? 'EN' : 'TH')} className="w-14 h-14 flex items-center justify-center bg-gray-800 text-white font-bold text-xl rounded-full shadow-lg border border-gray-600 z-50 transition-transform active:scale-95">{lang}</button>
                <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-14 h-14 flex items-center justify-center bg-gray-800 text-2xl rounded-full shadow-lg border border-gray-600 z-50 transition-transform active:scale-95">{isDarkMode ? '☀️' : '🌙'}</button>
              </div>
            </div>
          </BackgroundWrapper>
        );
      }

      const isHost = room.hostId === user.uid;

      if (room.state === 'settings') {
        return (
          <BackgroundWrapper>
            <div className="flex flex-col min-h-screen p-6 w-full max-w-md mx-auto z-10 relative">
               <h1 className="text-5xl font-black text-white mt-10 mb-1 text-center tracking-wider">{lang === 'TH' ? 'คำต้องห้าม' : 'Taboo'}</h1>
               <p className="text-center text-gray-400 mb-8 font-mono tracking-widest font-bold">{lang === 'TH' ? 'ห้อง:' : 'Room:'} {roomId}</p>
               {isHost ? (
                 <div className="flex-1 space-y-8 mt-4 bg-black/60 p-6 rounded-3xl backdrop-blur-md">
                   <div>
                      <h3 className="text-white text-lg mb-3 font-bold">{lang === 'TH' ? 'จำนวนผู้เล่น' : 'Players'}</h3>
                      <div className="flex space-x-3">
                        {[2,3,4].map(num => (
                          <button key={num} onClick={() => updateSetting('maxPlayers', num)} className={`flex-1 py-3 rounded-full font-bold text-lg transition ${room.settings.maxPlayers === num ? 'bg-white text-black' : 'bg-gray-800 text-gray-400'}`}>{num}</button>
                        ))}
                      </div>
                   </div>
                   <div>
                      <h3 className="text-white text-lg mb-3 font-bold">{lang === 'TH' ? 'รูปแบบคำ' : 'Mode'}</h3>
                      <div className="flex space-x-3">
                        {['อิสระ', 'หมวดหมู่'].map(mode => {
                          const modeText = mode === 'อิสระ' ? (lang === 'TH' ? 'อิสระ' : 'Random') : (lang === 'TH' ? 'หมวดหมู่' : 'Category');
                          return (
                          <button key={mode} onClick={() => updateSetting('mode', mode)} className={`flex-1 py-3 rounded-full font-bold text-lg transition ${room.settings.mode === mode ? 'bg-white text-black' : 'bg-gray-800 text-gray-400'}`}>{modeText}</button>
                        )})}
                      </div>
                   </div>
                   <div className="pt-8">
                     <button onClick={startGameSequence} className="w-full bg-white text-black font-black py-5 rounded-2xl text-2xl shadow-[0_0_20px_rgba(255,255,255,0.4)] active:scale-95 transition">{lang === 'TH' ? 'เริ่มเกม' : 'START'}</button>
                     <p className="text-center text-gray-400 mt-4">{lang === 'TH' ? 'ผู้เล่นเข้าร่วมแล้ว:' : 'Players joined:'} {room.players.length}/{room.settings.maxPlayers}</p>
                   </div>
                 </div>
               ) : (
                 <div className="flex-1 flex flex-col items-center justify-center">
                    <div className="bg-black/60 p-10 rounded-3xl backdrop-blur-md text-center">
                      <div className="w-16 h-16 border-4 border-t-white border-gray-600 rounded-full animate-spin mx-auto mb-6"></div>
                      <h2 className="text-3xl text-white font-bold">{lang === 'TH' ? 'รอสักครู่' : 'Please wait'}</h2>
                      <p className="text-gray-400 mt-2">{lang === 'TH' ? 'โฮสต์กำลังตั้งค่าเกม' : 'Host is setting up the game'}</p>
                    </div>
                 </div>
               )}
            </div>
          </BackgroundWrapper>
        );
      }

      if (room.state === 'spinning') {
        const wheelItems = lang === 'TH' ? CATEGORY_KEYS : CATEGORY_KEYS_EN;
        return (
          <BackgroundWrapper>
             <div className="flex flex-col min-h-screen justify-center items-center w-full max-w-md mx-auto p-4 z-10 relative">
                <h2 className="text-white text-2xl font-bold mb-8">{lang === 'TH' ? 'เลือกหมวดหมู่' : 'Select Category'}</h2>
                {isHost ? (
                   <WheelSpinner items={wheelItems} onLock={(item) => assignWordsAndStart(item)} lang={lang} />
                ) : (
                   <div className="text-white text-xl">{lang === 'TH' ? 'กำลังสุ่มหมวดหมู่...' : 'Spinning...'}</div>
                )}
             </div>
          </BackgroundWrapper>
        );
      }

      if (room.state === 'pregame') {
         return (
            <BackgroundWrapper>
               <div className="flex min-h-screen items-center justify-center z-10 relative">
                  <h1 className="text-4xl text-white font-black text-center px-4 leading-relaxed animate-pulse">
                    {lang === 'TH' ? 'คำในหมวด' : 'Category'}<br/><span className="text-6xl text-yellow-400 mt-4 block">"{room.category}"</span>
                  </h1>
               </div>
            </BackgroundWrapper>
         );
      }

      const handlePointerDown = (isReplay) => {
         if (!isHost) return;
         pressTimerRef.current = setTimeout(() => { resetGame(isReplay); }, 1000);
      };
      const handlePointerUp = () => { if (pressTimerRef.current) clearTimeout(pressTimerRef.current); };

      const isRandomMode = room.category === 'อิสระ' || room.category === 'Random';
      const categoryText = isRandomMode 
         ? (lang === 'TH' ? 'คำอิสระ' : 'Random Words') 
         : (lang === 'TH' ? `คำในหมวด: ${room.category}` : `Category: ${room.category}`);

      return (
        <BackgroundWrapper>
           <div className="flex flex-col h-[100dvh] w-full mx-auto p-4 z-10 relative overflow-hidden">
              <div className="flex justify-between items-center mb-4 mt-2 max-w-3xl mx-auto w-full flex-shrink-0 z-20 bg-gray-900/80 p-3 rounded-2xl border border-gray-700 backdrop-blur-sm">
                 <h2 className="text-white text-lg sm:text-xl font-bold tracking-wider truncate mr-2">{categoryText}</h2>
                 <span className="text-gray-400 text-sm font-bold whitespace-nowrap">{lang === 'TH' ? 'ห้อง:' : 'Room:'} {roomId}</span>
              </div>
              
              <div className="flex-1 flex items-center justify-center w-full min-h-0">
                 <CardGrid players={room.players} currentUser={user} state={room.state} isDarkMode={isDarkMode} lang={lang} />
              </div>

              {room.state === 'playing' && isHost && (
                 <div className="flex-shrink-0 mt-4 mb-2 max-w-3xl mx-auto w-full">
                    <button onClick={() => updateDoc(doc(db, 'rooms', roomId), { state: 'revealed' })} className="bg-blue-600 text-white font-bold py-4 rounded-xl text-xl w-full shadow-lg active:scale-95 transition-transform">
                      {lang === 'TH' ? 'เปิดไพ่' : 'Reveal Cards'}
                    </button>
                 </div>
              )}

              {room.state === 'revealed' && (
                 <div className="flex-shrink-0 mt-4 mb-2 bg-black/60 p-4 rounded-3xl backdrop-blur-md w-full max-w-3xl mx-auto space-y-3 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                    <p className="text-center text-white mb-2 font-bold text-lg">{lang === 'TH' ? 'โหวตตาต่อไป' : 'Vote Next Round'}</p>
                    <div className="flex space-x-3">
                       <button 
                         onClick={() => handleVote('replayVotes')}
                         onPointerDown={() => handlePointerDown(true)}
                         onPointerUp={handlePointerUp}
                         onPointerLeave={handlePointerUp}
                         className={`flex-1 py-4 rounded-2xl font-black text-xl transition-all ${room.replayVotes?.includes(user.uid) ? 'bg-blue-500 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)] scale-95' : 'bg-gray-700 text-gray-300'}`}
                       >
                         {lang === 'TH' ? 'เล่นซ้ำ' : 'Replay'}
                       </button>
                       <button 
                         onClick={() => handleVote('restartVotes')}
                         onPointerDown={() => handlePointerDown(false)}
                         onPointerUp={handlePointerUp}
                         onPointerLeave={handlePointerUp}
                         className={`flex-1 py-4 rounded-2xl font-black text-xl transition-all ${room.restartVotes?.includes(user.uid) ? 'bg-red-500 text-white shadow-[0_0_15px_rgba(239,68,68,0.5)] scale-95' : 'bg-gray-700 text-gray-300'}`}
                       >
                         {lang === 'TH' ? 'หน้าหลัก' : 'Main Menu'}
                       </button>
                    </div>
                    {isHost && <p className="text-center text-gray-500 text-xs mt-1">
                      {lang === 'TH' ? '(โฮสต์: กดปุ่มไหนก็ได้ค้างไว้ 1 วิ เพื่อบังคับไปต่อ)' : '(Host: Hold any button for 1s to force)'}
                    </p>}
                 </div>
              )}
           </div>
        </BackgroundWrapper>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
